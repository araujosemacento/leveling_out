<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Leveling Out : Sandbox Dev Harness</title>
		<!-- Fontes Estilizadas: Bagel Fat One e Capriola | Utilitárias: Mona Sans e SN Pro | Monospace: Fira Code -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Capriola&family=Fira+Code:wght@400;500;600&family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@fontsource/sn-pro@latest/index.min.css"
		/>
		<script>
			(function () {
				try {
					var saved = null;
					var match = document.cookie.match(/(?:^|; )theme=(light|dark)(?:;|$)/);
					if (match) {
						saved = match[1];
					} else {
						saved = localStorage.getItem('theme');
					}
					var theme =
						saved === 'light' || saved === 'dark'
							? saved
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
	</head>
	<body class="bg-bg-base text-text-primary antialiased">
		<div id="app"></div>
		<script type="module" src="/main.ts"></script>
	</body>
</html>

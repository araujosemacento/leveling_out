<svg id="eU23CKdFX481" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="background-color:#000"><style> /* Configuracao das Raquetes (Retangulos) */ .paddle-left { animation: moveLeftPaddle 1.5s infinite; animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55); } .paddle-right { animation: moveRightPaddle 1.5s infinite; animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55); } /* Configuracao da Bola (Ellipse) */ .ball { animation: moveBall 1.5s infinite; animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1); } /* Keyframes da Raquete Esquerda */ @keyframes moveLeftPaddle { 0% { transform: translate(50px, 50px); } 46.67%, 100% { transform: translate(50px, 150px); } } /* Keyframes da Raquete Direita */ @keyframes moveRightPaddle { 0% { transform: translate(225px, 150px); } 20% { transform: translate(225px, 175px); } 100% { transform: translate(227.8px, 30px); } } /* Keyframes da Bola */ @keyframes moveBall { 0% { transform: translate(190px, 165px); } 26.67% { transform: translate(126.29px, 235px); } 46.67% { transform: translate(90px, 195.09px); } 100% { transform: translate(204.91px, 65px); } } </style><ellipse class="ball" rx="15" ry="15" transform="translate(190 165)" fill="#e9e9e9" stroke-width="0"/><rect class="paddle-left" width="25" height="100" rx="12.5" ry="12.5" transform="translate(50 50)" fill="#e9e9e9" stroke-width="0"/><rect class="paddle-right" width="25" height="100" rx="12.5" ry="12.5" transform="translate(225 150)" fill="#e9e9e9" stroke-width="0"/></svg>